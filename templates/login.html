<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 15px; background: #18191a; color: #e4e6eb; }
        .box { background: #242526; border: 1px solid #393a3b; padding: 25px; border-radius: 8px; }
        input { width: 100%; box-sizing: border-box; margin-top: 8px; margin-bottom: 16px; padding: 10px; background: #3a3b3c; border: 1px solid #4e4f50; border-radius: 6px; color: white; }
        button { width: 100%; background: #2374e1; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .error { color: #e41e3f; margin-bottom: 12px; }
        a { color: #4e95ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Вход</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>Имя пользователя:</label>
            <input type="text" name="username" required>
            <label>Пароль:</label>
            <input type="password" name="password" required>
            <button type="submit">Войти</button>
        </form>
        <p style="margin-top: 15px; font-size: 0.9em;">Нет аккаунта? <a href="/register">Регистрация</a></p>
        <p><a href="/">&larr; На главную</a></p>
    </div>
</body>
</html>
