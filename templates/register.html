<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="box box-narrow">
        <h2>Регистрация</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>Имя пользователя:</label>
            <input type="text" name="username" required>
            <label>Пароль:</label>
            <input type="password" name="password" required>
            <button type="submit" class="btn-block">Создать аккаунт</button>
        </form>
        <p style="margin-top: 15px; font-size: 0.9em;">Уже зарегистрированы? <a href="/login">Вход</a></p>
        <p><a href="/">&larr; На главную</a></p>
    </div>
</body>
</html>
